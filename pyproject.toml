[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gainweave"
version = "0.2.0"
description = "HDR image generation with frozen decoder features and bounded residual gains"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{name = "Noel2211"}]
dependencies = [
  "torch>=2.8,<2.9", "numpy==1.26.4", "Pillow>=11,<12",
  "diffusers==0.35.2", "transformers==4.53.3", "accelerate==1.9.0",
  "huggingface-hub==0.34.4", "safetensors==0.5.3",
  "opencv-python-headless==4.9.0.80", "PyYAML==6.0.3",
  "sentencepiece==0.2.0", "protobuf>=6.31,<7", "einops==0.8.1"
]

[project.optional-dependencies]
train = ["tqdm>=4.67,<5"]
dev = ["pytest>=8,<9", "build>=1.2,<2", "ruff>=0.9"]

[project.scripts]
gainweave = "gainweave.cli:main"

[project.urls]
Repository = "https://github.com/913886605/GainWeave"
Models = "https://huggingface.co/Noel2211/GainWeave"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "paper/tests"]

[tool.ruff]
line-length = 100
